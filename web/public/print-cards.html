<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Closer — demo table cards (print)</title>
<style>
  :root {
    --ink: #0b0e14;
    --muted: #4b5768;
    --primary: #4c650b;
    --accent: #f5ffdb;
    --border: #d7dbe0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #eef1f4;
    color: var(--ink);
    font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .toolbar {
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .toolbar button {
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 999px;
    border: none;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
  }
  .sheet {
    width: 11in;
    min-height: 8.5in;
    margin: 0 auto 40px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5in;
    padding: 0.5in;
  }
  .card {
    width: 4.5in;
    height: 6.5in;
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 0.45in 0.4in;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .brand svg { width: 26px; height: 26px; }
  .brand span {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .role {
    display: inline-block;
    background: var(--accent);
    color: var(--primary);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 5px 14px;
    border-radius: 999px;
  }
  .name {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 2px 0 0;
  }
  .blurb {
    font-size: 14px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 3.4in;
  }
  .qr-wrap {
    margin: 10px 0;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
  }
  .qr-wrap img { width: 2.6in; height: 2.6in; display: block; }
  .phone {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 17px;
    font-weight: 600;
    color: var(--primary);
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: -6px;
  }
  .opener {
    margin-top: auto;
    font-size: 12.5px;
    color: var(--muted);
    font-style: italic;
    border-top: 1px dashed var(--border);
    padding-top: 12px;
  }

  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .sheet {
      width: auto;
      min-height: auto;
      margin: 0;
      padding: 0;
      box-shadow: none;
    }
    .card { border-color: #ccc; }
    @page { size: letter landscape; margin: 0.4in; }
  }
</style>
</head>
<body>
  <div class="toolbar"><button onclick="window.print()">Print</button></div>

  <div class="sheet">
    <div class="card">
      <div class="brand">
        <img src="logo-mark-print.png" alt="" style="height:26px;width:auto;object-fit:contain" />
        <span>Closer</span>
      </div>
      <span class="role">Play the buyer</span>
      <p class="name">Closer AI</p>
      <p class="blurb">Text a listing and get coached in real time — the exact number to send, and when the seller's bluffing.</p>
      <div class="qr-wrap"><img src="qr-buyer.svg" alt="QR to text Closer AI" /></div>
      <p class="phone">(205) 261-1117</p>
      <p class="hint">Scan, or text the number above</p>
      <p class="opener">Opens with: "Hi Closer — check out this listing, what should I offer?"</p>
    </div>
  </div>
</body>
</html>
